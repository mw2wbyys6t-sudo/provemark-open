[project]
name = "orderdesk-api"
version = "0.9.3"
description = "OrderDesk order-management API"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "flask>=3.0",
  "requests==2.19.1",
  "pyyaml==5.1",
  "jinja2==2.10",
  "pyjwt>=2.0",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
