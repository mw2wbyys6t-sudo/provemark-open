<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Provemark">
  <title>Provemark</title>
  <desc>An ink-dark tile holding a tilted seal stamped with a check mark: provenance, verified locally.</desc>
  <defs>
    <linearGradient id="pm-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#151F38"/>
    </linearGradient>
    <linearGradient id="pm-gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pm-seal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="0.52" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#pm-tile)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#pm-gloss)"/>
  <rect x="15.5" y="15.5" width="481" height="481" rx="98" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="3"/>

  <g transform="rotate(-8 256 256)">
    <rect x="140" y="140" width="232" height="232" rx="56" fill="url(#pm-seal)"/>
    <rect x="158" y="158" width="196" height="196" rx="44" fill="none" stroke="#071019" stroke-opacity="0.16" stroke-width="4"/>
    <rect x="140" y="140" width="232" height="232" rx="56" fill="none" stroke="#08111F" stroke-opacity="0.28" stroke-width="6"/>
    <path d="M202 252 L242 294 L318 194" fill="none" stroke="#071019" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
