<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" font-family="-apple-system, 'Segoe UI', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="460" fill="#f8fafc"/>
  <text x="40" y="48" font-size="25" font-weight="700" fill="#0f172a">维护工作流：每一步都有人盯着</text>
  <text x="40" y="74" font-size="14" fill="#475569">上图是插件在会话里的实际行为；它不替代 review，但让“越改越糟”变得可见、可回退。</text>

  <g>
    <rect x="40" y="112" width="250" height="150" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="72" cy="144" r="15" fill="#6366f1"/><text x="72" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">1</text>
    <text x="98" y="150" font-size="16" font-weight="700" fill="#0f172a">写代码</text>
    <text x="62" y="184" font-size="13" fill="#334155">提示词常驻安全/工程/</text>
    <text x="62" y="205" font-size="13" fill="#334155">算法红线，模型先避开</text>
    <text x="62" y="226" font-size="13" fill="#334155">幻觉依赖、注入、无超时</text>
    <text x="62" y="247" font-size="13" fill="#64748b">（不是事后才报）</text>

    <path d="M 298 187 L 352 187" stroke="#475569" stroke-width="2" marker-end="url(#a2)"/>

    <rect x="360" y="112" width="250" height="150" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="392" cy="144" r="15" fill="#6366f1"/><text x="392" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">2</text>
    <text x="418" y="150" font-size="16" font-weight="700" fill="#0f172a">改动</text>
    <text x="382" y="184" font-size="13" fill="#334155">工具活动后自动复扫</text>
    <text x="382" y="205" font-size="13" fill="#334155">复扫前状态块首行出现</text>
    <text x="382" y="226" font-size="13" fill="#b45309">⚠️ 结论可能已过期</text>
    <text x="382" y="247" font-size="13" fill="#64748b">8s 去抖 / 30s 下限</text>

    <path d="M 618 187 L 672 187" stroke="#475569" stroke-width="2" marker-end="url(#a2)"/>

    <rect x="680" y="112" width="250" height="150" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="712" cy="144" r="15" fill="#6366f1"/><text x="712" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">3</text>
    <text x="738" y="150" font-size="16" font-weight="700" fill="#0f172a">交付前</text>
    <text x="702" y="184" font-size="13" fill="#334155">provemark_guard(fresh)</text>
    <text x="702" y="205" font-size="13" fill="#334155">返回 verdict + trend</text>
    <text x="702" y="226" font-size="13" fill="#334155">blocking 必须修或说明</text>
    <text x="702" y="247" font-size="13" fill="#64748b">新增 critical/high → 阻断</text>

    <path d="M 938 187 L 992 187" stroke="#475569" stroke-width="2" marker-end="url(#a2)"/>

    <rect x="1000" y="112" width="160" height="150" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <circle cx="1032" cy="144" r="15" fill="#22c55e"/><text x="1032" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">4</text>
    <text x="1058" y="150" font-size="16" font-weight="700" fill="#14532d">修复 / 门禁</text>
    <text x="1022" y="184" font-size="13" fill="#166534">security/dependency</text>
    <text x="1022" y="205" font-size="13" fill="#166534">优先修</text>
    <text x="1022" y="226" font-size="13" fill="#166534">其余登记 ignore</text>
    <text x="1022" y="247" font-size="13" fill="#166534">或写待办</text>
  </g>

  <rect x="40" y="300" width="1120" height="120" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="64" y="332" font-size="16" font-weight="700" fill="#3730a3">基线棘轮：只要求“不比进来时更差”</text>
  <text x="64" y="362" font-size="13.5" fill="#312e81">首次扫描冻结基线（写盘、跨重启）→ 之后每次比较新增/修掉 → 新增 &gt; 0 就回退或先修这一批 → 新增 = 0 才继续下一批。</text>
  <text x="64" y="388" font-size="13.5" fill="#312e81">老项目基线差是允许的；但不许用新的 ignore 掩盖回归。确认接受现状时用 provemark_guard(resetBaseline: true) 重置。</text>
</svg>
